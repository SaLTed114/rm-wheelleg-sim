version = 1
name = "turn-envelope-coarse"

[paths]
model = "../../models/MJCF/COD-2026RoboMaster-Balance.xml"
output_root = "../../build/experiments/results"

[build]
root = "../../build/experiments"
configuration = "Release"
cmake_args = []

[controller]
leg_length = 0.18
forward_observation = "wheel-odometry"
roll_restrained = false
trace_stride = 10
yaw_acceleration_feedforward_scale = 0.9

[lqr]
mode = "existing"
schedule_dir = "../lqr/generated"

[[turn_sweep]]
name = "turn"
forward_velocities = [1.0, 1.5, 2.0, 2.5, 3.0]
yaw_rates = [
  -4.71238898038469,
  -3.14159265358979,
  -1.57079632679490,
  1.57079632679490,
  3.14159265358979,
  4.71238898038469,
]
forward_rate = 5.0
yaw_rate = 10.0
standing_seconds = 8.0
target_hold_seconds = 2.0
stop_settle_seconds = 3.0
