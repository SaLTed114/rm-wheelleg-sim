version = 1
name = "lqr-schedule-generation-example"

[paths]
model = "../../models/MJCF/COD-2026RoboMaster-Balance.xml"
output_root = "../../build/experiments/results"

[build]
root = "../../build/experiments"
configuration = "Release"
cmake_args = []

[controller]
leg_length = 0.18
forward_observation = "wheel-odometry"
roll_restrained = false
trace_stride = 10

[lqr]
mode = "generate"

[lqr.generate]
model_parameters = "../lqr/generated/current_model_schedule.json"
q_diagonal = [90, 260, 40, 15, 60, 1, 60, 1, 900, 120]
r_diagonal = [1.6, 1.6, 0.7, 0.7]
leg_angle_difference_weight = 960
leg_angular_velocity_difference_weight = 16

[analysis]
forward_linear = true

[[case]]
name = "forward_pos_2_a0p5"
axis = "forward"
target = 2.0
command_rate = 0.5
standing_seconds = 8.0
target_hold_seconds = 3.0
stop_settle_seconds = 2.0

[[case]]
name = "forward_pos_2_a1"
axis = "forward"
target = 2.0
command_rate = 1.0
standing_seconds = 8.0
target_hold_seconds = 3.0
stop_settle_seconds = 2.0

[[case]]
name = "forward_pos_2_a5"
axis = "forward"
target = 2.0
command_rate = 5.0
standing_seconds = 8.0
target_hold_seconds = 3.0
stop_settle_seconds = 2.0
